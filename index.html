<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="钱多多的个人主页 - 电力工程师 / 数据分析 / AI 工具探索者">
    <title>钱多多 | 个人主页</title>
    <!-- Google Fonts：Inter / Instrument Serif Italic / JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- 本地字体声明 + 字体栈变量 -->
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="floating-lines.css">
    <link rel="stylesheet" href="flowing-menu.css">
    <link rel="stylesheet" href="card-nav.css">
    <link rel="stylesheet" href="star-border.css">
    <link rel="stylesheet" href="electric-border.css">
</head>
<body>
    <!-- CardNav 顶部导航（React Bits） -->
    <div id="card-nav-root"></div>

    <!-- FloatingLines WebGL 背景 -->
    <div id="floating-lines-bg"></div>

    <main class="container">
        <!-- Hero 区 -->
        <section class="hero">
            <div class="hero-avatar">Q</div>
            <h1 class="hero-title">钱多多</h1>
            <p class="hero-subtitle">Hello, world</p>
            <p class="hero-tagline">欢迎来到我的个人主页 · 持续学习，持续记录</p>
        </section>

        <!-- FlowingMenu 资料区（React Bits） -->
        <div id="flowing-menu-root" class="flowing-menu-container"></div>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 钱多多 · Built with <span class="heart">❤️</span> and AI</p>
        </footer>
    </main>

    <!-- 脚本：FloatingLines 背景（ES module，从 jsdelivr 加载 three.js） -->
    <script type="module" src="floating-lines.js"></script>
    <!-- React + ReactDOM + GSAP（CDN，FlowingMenu / CardNav 共享） -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <!-- 脚本：FlowingMenu 组件（依赖 React + GSAP） -->
    <script src="flowing-menu.js"></script>
    <!-- 脚本：StarBorder 包装（vanilla） -->
    <script src="star-border.js"></script>
    <!-- 脚本：ElectricBorder 头像（vanilla） -->
    <script src="electric-border.js"></script>
    <!-- 脚本：CardNav 组件（依赖 React + GSAP） -->
    <script src="card-nav.js"></script>
</body>
</html>
