<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="钱多多的个人主页 - 电力工程师 / 数据分析 / AI 工具探索者">
    <title>钱多多 | 个人主页</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="lightfall.css">
</head>
<body>
    <!-- Lightfall WebGL 背景 -->
    <div id="lightfall-bg"></div>

    <main class="container">
        <!-- Hero 区 -->
        <section class="hero">
            <div class="hero-avatar">Q</div>
            <h1 class="hero-title">钱多多</h1>
            <p class="hero-subtitle">Hello, world</p>
            <p class="hero-tagline">欢迎来到我的个人主页 · 持续学习，持续记录</p>
        </section>

        <!-- About 区 -->
        <section class="card">
            <h2>关于我</h2>
            <p>电力工程师 / 数据分析爱好者 / AI 工具探索者。日常工作与配电网运维打交道，下班后喜欢研究各种 AI 工具、捣鼓小项目。这个站点是学习用 AI 搭建网站的小练手，未来会持续更新。</p>
        </section>

        <!-- Skills 区 -->
        <section class="card">
            <h2>技能</h2>
            <div class="skill-chips">
                <span class="chip">配电网运维</span>
                <span class="chip">数据分析</span>
                <span class="chip">PPT 制作</span>
                <span class="chip">AI 工具</span>
                <span class="chip">内容创作</span>
                <span class="chip">信息整理</span>
            </div>
        </section>

        <!-- Now 区 -->
        <section class="card">
            <h2>最近在做什么</h2>
            <p>研究 AI Agent 框架、自动化工作流、还有怎么用 AI 工具把日常繁琐任务简化掉。喜欢把学到的知识整理成文档分享出去。</p>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 钱多多 · Built with <span class="heart">❤️</span> and AI</p>
        </footer>
    </main>

    <!-- Lightfall 背景脚本（ES module，从 jsdelivr 加载 ogl） -->
    <script type="module" src="lightfall.js"></script>
</body>
</html>
